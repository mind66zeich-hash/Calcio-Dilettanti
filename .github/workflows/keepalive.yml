name: Keep-alive Supabase

# I progetti Supabase gratuiti vengono messi in pausa dopo circa 7 giorni di inattivita'.
# Questo job fa una piccola lettura due volte a settimana per evitarlo.

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroga il database
        run: |
          curl -fsS "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/seasons?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" > /dev/null
